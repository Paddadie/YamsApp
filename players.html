<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Yams — Joueurs</title>

    <link rel="icon" href="/de.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Yams" />
  </head>
  <body>
    <div id="players-screen" class="screen">
      <div class="screen-body">
        <h2>👥 Joueurs de la partie</h2>

        <form id="player-form">
          <input
            type="text"
            id="player-name"
            placeholder="Nouveau joueur…"
            autocomplete="off"
          />
          <button type="submit">Ajouter</button>
        </form>

        <p id="roster-count"></p>
        <ul id="roster"></ul>
      </div>

      <div id="start-game-container" class="action-bar">
        <button id="start-game-btn" class="btn btn-primary" disabled>
          🎲 Commencer la partie
        </button>
        <a href="index.html" class="btn btn-secondary">🏠 Retour</a>
      </div>
    </div>

    <script type="module" src="/src/pages/players.ts"></script>
  </body>
</html>
