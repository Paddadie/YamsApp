<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Cornet</title>
    <!--@head-->
  </head>
  <body>
    <div id="menu-screen" class="screen">
      <header class="brand-bar">
        <h1 class="brand-name">Cornet</h1>
        <!-- Le cornet renversé et ses dés, dessinés par home.ts. -->
        <span class="brand-mark" id="brand-mark"></span>
        <a
          id="settings-btn"
          href="settings.html"
          class="screen-bar-action"
          aria-label="Paramètres"
          title="Paramètres"
          ><!--@icon:gear--></a
        >
      </header>
      <div class="screen-body">
        <!-- La dernière victoire, tous jeux confondus (home.ts, lastWinRepo). En
             tête et non sous les cartes : avec d'autres jeux, il passerait sous
             le pli (demande de Paul, 08/10). -->
        <aside class="postit last-win" id="last-win" hidden></aside>
        <p class="section-label">Choisissez un jeu</p>
        <!-- Cartes générées par src/pages/home.ts d'après src/games/registry.ts -->
        <ul id="game-list"></ul>
      </div>
    </div>

    <!-- Proposée au menu tant que Cornet n'est pas installé (home.ts,
         core/pwa/install.ts). « Plus tard » ou un clic à côté : dans une
         semaine. Le bouton « Installer » n'existe que là où le navigateur sait
         installer (Android, Chrome) ; sur iPhone, les deux gestes. -->
    <dialog id="install-dialog" aria-labelledby="install-title" tabindex="-1">
      <p class="sheet-title" id="install-title">Installer Cornet</p>
      <!-- L'icône qui arrivera sur l'écran d'accueil. -->
      <div class="install-intro">
        <img class="install-icon" src="/apple-touch-icon.png" alt="" width="56" height="56" />
        <p class="message-text">
          Sur l'écran d'accueil, Cornet s'ouvre comme une application, même hors
          ligne, et vos joueurs et palmarès ne risquent plus d'être effacés par le
          navigateur.
        </p>
      </div>
      <div id="install-steps"></div>
      <div class="delete-actions">
        <button type="button" id="install-later" class="btn btn-secondary">Plus tard</button>
        <button type="button" id="install-go" class="btn btn-primary" hidden>Installer</button>
      </div>
      <button type="button" id="install-never" class="link-plain install-never">
        Ne plus demander
      </button>
    </dialog>

    <script type="module" src="/src/pages/home.ts"></script>
  </body>
</html>
