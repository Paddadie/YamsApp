<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Yams — Palmarès</title>
    <!--@head-->
  </head>
  <body>
    <div id="hall-screen" class="screen">
      <header class="page-head">
        <p class="page-eyebrow">Yams</p>
        <!-- Cinq touchers sur le trophée : les crédits (hall.ts). -->
        <h1 class="page-title">
          <span id="hof-trophy" class="hof-trophy"><!--@icon:trophy--></span>Palmarès
        </h1>
      </header>
      <div id="hall-content">
        <p class="hall-hint">Touchez une partie pour voir le détail des points.</p>

        <div id="record-card" class="postit" hidden></div>

        <!-- Un papier de couleur par famille, avec son onglet : meilleurs en
             jaune, pires en rose, statistiques en bleu (demande de Paul :
             blanc sur fond clair, les trois blocs se distinguaient mal). -->
        <section class="hall-block paper-block paper-block--best">
          <h2 class="paper-tab"><!--@icon:crown-->Meilleurs scores</h2>
          <table id="best-scores-table">
            <thead>
              <tr>
                <th></th>
                <th>Joueur</th>
                <th>Variante</th>
                <th>Date</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section class="hall-block paper-block paper-block--worst">
          <h2 class="paper-tab"><!--@icon:fall-->Pires scores · classiques</h2>
          <table id="worst-scores-table">
            <thead>
              <tr>
                <th></th>
                <th>Joueur</th>
                <th>Date</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section class="hall-block paper-block paper-block--stats">
          <h2 class="paper-tab"><!--@icon:chart-->Statistiques · classiques</h2>
          <ul id="stats-list"></ul>
        </section>
      </div>

      <div class="action-bar">
        <a href="yams.html" class="btn btn-secondary btn-outline"><!--@icon:home-->Retour</a>
      </div>
    </div>

    <dialog id="sheet-dialog">
      <div class="sheet-head">
        <p class="sheet-player" id="sheet-title"></p>
        <span class="sheet-rank" id="sheet-rank" hidden></span>
        <p class="sheet-meta" id="sheet-meta"></p>
        <p class="sheet-total"><span id="sheet-total-value"></span>&nbsp;pts</p>
      </div>
      <table id="sheet-table" class="score-sheet"></table>
      <div class="sheet-actions">
        <button type="button" id="sheet-close" class="btn btn-secondary">
          Fermer
        </button>
      </div>
    </dialog>

    <script type="module" src="/src/pages/yams/hall.ts"></script>
  </body>
</html>
