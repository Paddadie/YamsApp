<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>5000 — Palmarès</title>
    <!--@head-->
  </head>
  <body>
    <div id="g5000-records-screen" class="screen">
      <header class="page-head">
        <p class="page-eyebrow">5000</p>
        <!-- Le même trophée qu'au palmarès du Yams (sans ses crédits). -->
        <h1 class="page-title">
          <span class="hof-trophy"><!--@icon:trophy--></span>Palmarès
        </h1>
      </header>
      <div class="screen-body">
        <!-- Objectifs générés par src/pages/g5000/records.ts : un par objectif
             qui a des records. Masqués s'il n'y en a qu'un. -->
        <section class="target-block" id="target-block" hidden>
          <h2 class="section-label">Objectif</h2>
          <div class="target-seg" id="target-options"></div>
        </section>

        <!-- Texte posé par src/pages/g5000/records.ts (il nomme l'objectif). -->
        <p class="hall-note" id="records-empty" hidden></p>

        <!-- Un papier de couleur par famille, avec son onglet (comme au
             palmarès du Yams) : meilleurs en jaune, pires en rose, victoires
             en bleu. -->
        <section class="records-block paper-block paper-block--best">
          <h2 class="paper-tab"><!--@icon:crown-->Les meilleurs</h2>
          <ul class="record-cards" id="records-best"></ul>
        </section>

        <section class="records-block records-block--worst paper-block paper-block--worst">
          <h2 class="paper-tab"><!--@icon:fall-->Les pires</h2>
          <ul class="record-cards" id="records-worst"></ul>
        </section>

        <section class="records-block paper-block paper-block--stats" id="wins-block" hidden>
          <h2 class="paper-tab"><!--@icon:trophy-->Victoires</h2>
          <ul class="wins-list" id="wins-list"></ul>
        </section>
      </div>

      <div class="action-bar">
        <a id="back-btn" href="5000.html" class="btn btn-secondary btn-outline"><!--@icon:home-->Retour</a>
      </div>
    </div>

    <script type="module" src="/src/pages/g5000/records.ts"></script>
  </body>
</html>
