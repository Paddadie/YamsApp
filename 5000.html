<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>5000</title>
    <!--@head-->
  </head>
  <body>
    <div id="home-screen" class="screen">
      <!-- Même en-tête qu'à l'accueil du Yams (voir yams.html). L'objectif s'y
           choisit : c'est lui qui donne son nom au jeu. -->
      <header class="game-hero">
        <div class="screen-bar-start">
          <h1 class="screen-bar-title">
            <button
              type="button"
              id="game-switch"
              class="game-switch"
              aria-haspopup="true"
              aria-controls="game-switcher"
            ></button>
          </h1>
          <ul id="game-switcher" class="switcher-menu" hidden></ul>
        </div>
        <div class="screen-bar-actions">
          <a
            class="screen-bar-action"
            href="rules.html?game=g5000"
            aria-label="Règles du 5000"
            title="Règles du 5000"
            ><!--@icon:info--></a
          >
          <a
            class="screen-bar-action"
            href="settings.html?game=g5000"
            aria-label="Réglages du 5000"
            title="Réglages du 5000"
            ><!--@icon:gear--></a
          >
        </div>
        <p class="game-hero-tagline" id="game-tagline"></p>
        <section class="game-hero-choice">
          <h2 class="section-label">Objectif de la partie</h2>
          <!-- Objectifs générés par src/pages/g5000/home.ts -->
          <div class="target-seg" id="target-options"></div>
        </section>
        <!-- La partie en cours, quand il y en a une (home.ts) : dans l'en-tête, à
             la place des dés — elle dit où en est ce jeu ; dessous, on en lance
             une autre (audit du 09/10, piste B). -->
        <section class="resume-card sheet" id="resume-card" hidden>
          <div class="resume-text">
            <h2 class="section-label">Partie en cours</h2>
            <span class="resume-who" id="resume-who"></span>
          </div>
          <button
            id="resume-btn"
            type="button"
            class="btn btn-primary btn-outline btn-small"
            disabled
          >
            <!--@icon:play-->Reprendre
          </button>
        </section>
        <!-- Les dés lancés du jeu (gameHero.ts) : la place libre devient une scène. -->
        <div class="game-hero-scene" id="game-scene"></div>
      </header>

      <div class="screen-body">
        <section class="variants">
          <h2 class="section-label">Variantes</h2>
          <!-- Lignes générées par src/pages/g5000/home.ts -->
          <div class="variant-list sheet" id="g5000-variant-options"></div>
        </section>
      </div>

      <div class="action-bar action-bar--row">
        <a href="5000-records.html" class="btn btn-gold btn-outline"><!--@icon:trophy-->Palmarès</a>
        <button id="start-btn" type="button" class="btn btn-primary btn-grow">
          <!--@icon:die-->Commencer
        </button>
      </div>
    </div>

    <script type="module" src="/src/pages/g5000/home.ts"></script>
  </body>
</html>
