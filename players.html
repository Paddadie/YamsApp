<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Yams — Joueurs</title>
    <!--@head-->
  </head>
  <body>
    <div class="screen">
      <div class="screen-body">
        <h1>🪑 Autour de la table</h1>

        <form id="player-form">
          <input
            type="text"
            id="player-name"
            placeholder="Ajouter ou filtrer…"
            autocomplete="off"
          />
          <button type="submit">Ajouter</button>
        </form>

        <div id="roster-bar">
          <span id="roster-count"></span>
          <button id="reuse-btn" type="button" class="roster-tool" hidden>
            ↺ Mêmes joueurs
          </button>
          <button id="shuffle-btn" type="button" class="roster-tool" hidden>
            🎲 Ordre aléatoire
          </button>
        </div>
        <ul id="roster"></ul>
      </div>

      <div class="action-bar">
        <button id="start-game-btn" type="button" class="btn btn-primary" disabled>
          🎲 Commencer la partie
        </button>
        <a href="index.html" class="btn btn-secondary">🏠 Retour</a>
      </div>
    </div>

    <dialog id="new-game-dialog">
      <p class="sheet-title">Une partie est en cours</p>
      <dl id="new-game-summary" class="delete-summary"></dl>
      <p class="delete-warn">
        Commencer une nouvelle partie effacera définitivement celle-ci.
      </p>
      <div class="delete-actions">
        <button type="button" id="new-game-cancel" class="btn btn-secondary">
          Annuler
        </button>
        <button type="button" id="new-game-confirm" class="btn btn-danger">
          Oui, commencer
        </button>
      </div>
    </dialog>

    <script type="module" src="/src/pages/players.ts"></script>
  </body>
</html>
