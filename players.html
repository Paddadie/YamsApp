<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yams — Joueurs</title>

    <link rel="icon" href="/de.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Yams" />
  </head>
  <body>
    <div id="players-screen" class="screen">
      <div class="players-content">
        <h2>👥 Ajouter des joueurs</h2>
        <form id="player-form">
          <input
            type="text"
            id="player-name"
            placeholder="Nom du joueur"
            required
          />
          <button type="submit">Ajouter</button>
        </form>
        <div class="known-players-container">
          <h3>📋 Joueurs existants</h3>
          <ul id="known-players-list" class="scrollable-list">
            <li class="empty-placeholder">
              Aucun joueur enregistré pour l’instant.
            </li>
          </ul>
        </div>
        <div class="next-players-container">
          <h3>🎮 Joueurs de la prochaine partie</h3>
          <ul id="player-list" class="scrollable-next-list">
            <li class="empty-placeholder">
              Aucun joueur ajouté pour l’instant.
            </li>
          </ul>
        </div>
      </div>
      <div id="start-game-container">
        <button id="start-game-btn" class="btn btn-primary" disabled>
          🎲 Commencer la partie
        </button>
        <button id="back-to-variants-btn" class="btn btn-secondary">
          🏠 Retour
        </button>
      </div>
    </div>

    <script type="module" src="/src/pages/players.ts"></script>
  </body>
</html>
