<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Yams — Partie</title>
    <!--@head-->
  </head>
  <body>
    <div id="game-screen" class="screen">
      <div class="player-header">
        <button id="prev-player-btn" type="button" class="nav-arrow" aria-label="Joueur précédent">⬅️</button>
        <h1 id="current-player-name"></h1>
        <button id="next-player-btn" type="button" class="nav-arrow" aria-label="Joueur suivant">➡️</button>
      </div>
      <div id="score-tables"></div>
      <div class="action-bar">
        <button id="pause-btn" type="button" class="btn btn-secondary">⏸ Pause</button>
      </div>
    </div>

    <dialog id="value-picker" tabindex="-1">
      <div class="picker-head">
        <span class="picker-variant" id="picker-variant" aria-hidden="true"></span>
        <span class="picker-line" id="picker-line"></span>
      </div>
      <div class="picker-values" id="picker-values"></div>
      <button type="button" class="picker-clear" id="picker-clear" hidden>
        Effacer la valeur
      </button>
    </dialog>

    <script type="module" src="/src/pages/game.ts"></script>
  </body>
</html>
