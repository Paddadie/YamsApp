<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Yams — Hall of Fame</title>

    <link rel="icon" href="/de.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Yams" />
  </head>
  <body>
    <div id="hall-screen" class="screen">
      <h2>🏆 Hall of Fame</h2>

      <div id="hall-content">
        <section>
          <h3>👑 Meilleurs scores</h3>
          <table id="best-scores-table">
            <thead>
              <tr>
                <th></th>
                <th>Joueur</th>
                <th>Date</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section>
          <h3>💩 Pires scores</h3>
          <table id="worst-scores-table">
            <thead>
              <tr>
                <th></th>
                <th>Joueur</th>
                <th>Date</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section>
          <h3>📊 Statistiques</h3>
          <ul id="stats-list"></ul>
        </section>
      </div>

      <div id="hall-footer" class="action-bar">
        <a href="index.html" class="btn btn-secondary">🏠 Retour</a>
      </div>
    </div>

    <dialog id="sheet-dialog">
      <p class="sheet-title" id="sheet-title"></p>
      <table id="sheet-table"></table>
      <button type="button" id="sheet-close" class="btn btn-secondary">
        Fermer
      </button>
    </dialog>

    <script type="module" src="/src/pages/hall.ts"></script>
  </body>
</html>
