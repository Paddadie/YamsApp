<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Yams — Hall of Fame</title>
    <!--@head-->
  </head>
  <body>
    <div id="hall-screen" class="screen">
      <div id="hall-content">
        <h1><span id="hof-trophy" class="hof-trophy">🏆</span> Hall of Fame</h1>
        <p class="hall-hint">Touchez une partie pour voir le détail des points.</p>

        <div id="record-card" hidden></div>

        <section class="hall-block hall-block--best">
          <h2>👑 Meilleurs scores</h2>
          <table id="best-scores-table">
            <thead>
              <tr>
                <th>Joueur</th>
                <th>Variante</th>
                <th>Date</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section class="hall-block hall-block--worst">
          <h2>💩 Pires scores</h2>
          <p class="hall-note">Parties classiques uniquement</p>
          <table id="worst-scores-table">
            <thead>
              <tr>
                <th>Joueur</th>
                <th>Date</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>

        <section class="hall-block hall-block--stats">
          <h2>📊 Statistiques</h2>
          <p class="hall-note">Parties classiques uniquement</p>
          <ul id="stats-list"></ul>
        </section>
      </div>

      <div class="action-bar">
        <a href="index.html" class="btn btn-secondary">🏠 Retour</a>
      </div>
    </div>

    <dialog id="sheet-dialog">
      <div class="sheet-head">
        <p class="sheet-player" id="sheet-title"></p>
        <span class="sheet-rank" id="sheet-rank" hidden></span>
        <p class="sheet-meta" id="sheet-meta"></p>
        <p class="sheet-total"><span id="sheet-total-value"></span>&nbsp;pts</p>
      </div>
      <table id="sheet-table"></table>
      <div class="sheet-actions">
        <button type="button" id="sheet-close" class="btn btn-secondary">
          Fermer
        </button>
      </div>
    </dialog>

    <script type="module" src="/src/pages/hall.ts"></script>
  </body>
</html>
